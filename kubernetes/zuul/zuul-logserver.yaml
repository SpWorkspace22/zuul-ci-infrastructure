
apiVersion: v1
kind: ConfigMap
metadata:
  name: zuul-logserver-nginx
  namespace: zuul
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /srv/static/logs;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        location / {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, Last-Modified, ETag" always;
            try_files $uri $uri/ =404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zuul-logserver
  namespace: zuul
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zuul-logserver
  template:
    metadata:
      labels:
        app: zuul-logserver
    spec:
      nodeSelector:
        kubernetes.io/hostname: zuul-local-control-plane
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: published-logs
              mountPath: /srv/static/logs
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: published-logs
          persistentVolumeClaim:
            claimName: zuul-published-logs
        - name: nginx-config
          configMap:
            name: zuul-logserver-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: zuul-logserver
  namespace: zuul
spec:
  selector:
    app: zuul-logserver
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
