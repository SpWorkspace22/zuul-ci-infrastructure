
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zuul-scheduler
  namespace: zuul
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zuul-scheduler
  template:
    metadata:
      labels:
        app: zuul-scheduler
    spec:
      containers:
        - name: scheduler
          image: quay.io/zuul-ci/zuul-scheduler@sha256:d6b58c2c20b3466b491d079450cfc5fb9ded92613f4f6f8c0dbc30f0dfa59dca
          imagePullPolicy: IfNotPresent

          env:
            - name: ZUUL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zuul-runtime-secrets
                  key: ZUUL_DB_PASSWORD

            - name: ZUUL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zuul-runtime-secrets
                  key: ZUUL_KEYSTORE_PASSWORD

            - name: ZUUL_GITHUB_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zuul-github-secrets
                  key: webhook_token

          volumeMounts:
            - name: zuul-config
              mountPath: /etc/zuul
              readOnly: true

            - name: zookeeper-client-tls
              mountPath: /etc/zuul/tls
              readOnly: true

            - name: github-app-key
              mountPath: /etc/zuul/github
              readOnly: true

            - name: scheduler-data
              mountPath: /var/lib/zuul

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        - name: zuul-config
          configMap:
            name: zuul-config
            items:
              - key: zuul.conf
                path: zuul.conf
              - key: main.yaml
                path: main.yaml

        - name: zookeeper-client-tls
          secret:
            secretName: zookeeper-client-tls

        - name: github-app-key
          secret:
            secretName: zuul-github-secrets
            items:
              - key: app_key
                path: github.pem

        - name: scheduler-data
          persistentVolumeClaim:
            claimName: zuul-scheduler-data
